[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "joycaption-api"
version = "0.1.0"
description = "Python client for a JoyCaption-style image captioning API: describe images through a hosted vision-language endpoint"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "joycaption"}]
keywords = ["ai api", "joycaption", "joycaption api", "joycaption python", "llava-13b", "synexa"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.24"]

[project.urls]
Homepage = "https://github.com/joycaption/joycaption-api"
Documentation = "https://joycaption.github.io/joycaption-api/"
"Hosted model" = "https://synexa.ai/explore/yorickvp/llava-13b?utm_source=github&utm_medium=ugc&utm_campaign=joycaption&utm_content=pyproject&utm_term=tier-a"

[tool.setuptools.packages.find]
include = ["joycaption_api*"]
